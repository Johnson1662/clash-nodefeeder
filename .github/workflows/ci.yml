name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: syntax
        run: python -m compileall -q nodefeeder.py tests
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: cli smoke
        run: |
          python nodefeeder.py --version
          python nodefeeder.py --help
          python nodefeeder.py init --config "$RUNNER_TEMP/config.json"
